; co2check - solar-harvesting CO2 sensor
; Target: Seeed XIAO nRF52840 + Sensirion SCD41

[env:xiao_nrf52840]
; The XIAO nRF52840 is not in PlatformIO's official `nordicnrf52` platform.
; Seeed maintains its own platform; pinned to a commit for reproducible builds.
; Drop the `#<sha>` to track main.
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#6a313a19f06994909627250a5e082e637bd34ff6
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino

; Upload over the UF2/serial bootloader: double-tap RESET if the port is not
; found. `use_1200bps_touch` in the board definition handles the normal case.
upload_protocol = nrfutil
monitor_speed = 115200

; The core's Wire_nRF52.cpp includes <Adafruit_TinyUSB.h> for Serial. That
; library ships inside the core, but the default `chain` finder does not put
; it on Wire's include path, so the build fails without both lines below.
lib_ldf_mode = deep+
lib_deps =
    sensirion/Sensirion I2C SCD4x @ ^1.1.0
    Adafruit TinyUSB Library

build_flags =
    -DUSE_TINYUSB
    -DCFG_DEBUG=0
